# Lenient baseline for adopting static typing on an existing codebase.
# scripts/check_type_ratchet.py pins the current error count and fails CI
# when it grows; lower the baseline as errors are fixed. Do not add ignores
# here to dodge the ratchet — fix or explicitly # type: ignore with a reason.
[mypy]
python_version = 3.10
ignore_missing_imports = True
no_implicit_optional = False
check_untyped_defs = False
files = mcp_package/link_core, mcp_package/link_mcp
