[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "link-mcp"
version = "2.2.1"
description = "MCP server for Link local agent memory — remember, recall, search, context, and graph traversal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2"]
keywords = ["mcp", "memory", "knowledge-base", "wiki", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
semantic = ["model2vec>=0.3,<1"]
semantic-quality = ["fastembed>=0.5,<1"]
rerank = ["fastembed>=0.5,<1"]

[project.urls]
Homepage = "https://github.com/gowtham0992/link"
Repository = "https://github.com/gowtham0992/link"

[project.scripts]
link-mcp = "link_mcp.server:main"
lnk = "link_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["link_mcp", "link_core"]

# The full CLI for pip installs (including Windows, which has no brew):
# the repo-root link.py ships twice on purpose - once as the importable
# link_cli module behind the `lnk` console script, once as the plain
# link.py data file that copy_runtime_files() plants into workspaces.
# serve.py / LINK.md / .linkignore ride along for the same reason.
[tool.hatch.build.targets.wheel.force-include]
"../link.py" = "link_cli.py"
"../serve.py" = "serve.py"
"../LINK.md" = "LINK.md"
"../.linkignore" = ".linkignore"

[tool.hatch.build.targets.sdist]
exclude = [
    ".mcpregistry_*",
    ".env",
    ".env.*",
    "*.token",
    "*.key",
    "*.pem",
    "*.p8",
    "*.p12",
    "id_rsa",
    "id_ed25519",
    "dist/",
]
