  <text x="360" y="23" text-anchor="middle" fill="#8a8174" style="font-size:12px;opacity:1;letter-spacing:.08em;">lnk · link remembers</text>
  <text x="30" y="66" class="dim" fill="#8a8174" style="animation:r_0 26s infinite;">— tuesday · a claude code session —</text>
  <text x="30" y="94" class="note" fill="#e0955f" style="animation:r_1 26s infinite;">◆ Link session-start · memory brief injected (empty, day one)</text>
  <text x="30" y="126" class="cmd" fill="#f3ece0" style="animation:r_2 26s infinite;">> from now on I only push to develop — never straight to main</text>
  <text x="30" y="152" class="dim" fill="#8a8174" style="animation:r_3 26s infinite;">understood — develop only.</text>
  <text x="30" y="184" class="note" fill="#e0955f" style="animation:r_4 26s infinite;">◆ Link session-end · captured 1 proposal for your review</text>
  <text x="30" y="210" class="out" fill="#e0b34f" style="animation:r_5 26s infinite;">pending: "only push to develop, never straight to main"</text>
  <text x="30" y="78" class="cmd" fill="#f3ece0" style="animation:r_6 26s infinite;">$ lnk review-memory only-push-to-develop</text>
  <text x="30" y="106" class="out" fill="#86c79a" style="animation:r_7 26s infinite;">✓ reviewed — durable memory now, because you approved it</text>
  <text x="30" y="130" class="note" fill="#e0955f" style="animation:r_8 26s infinite;">→ agents propose · you decide</text>
  <text x="30" y="66" class="dim" fill="#8a8174" style="animation:r_9 26s infinite;">— wednesday · brand-new terminal · zero context —</text>
  <text x="30" y="94" class="note" fill="#e0955f" style="animation:r_10 26s infinite;">◆ Link session-start · 1 memory injected</text>
  <text x="30" y="126" class="cmd" fill="#f3ece0" style="animation:r_11 26s infinite;">> which branch do I push to?</text>
  <text x="30" y="154" class="out" fill="#86c79a" style="animation:r_12 26s infinite;">✓ develop only — never straight to main</text>
  <text x="30" y="180" class="note" fill="#e0955f" style="animation:r_13 26s infinite;">→ from wiki/memories/only-push-to-develop.md</text>
  <text x="30" y="216" class="dim" fill="#8a8174" style="animation:r_14 26s infinite;">plain Markdown · reviewed by you · shared by every agent</text>
