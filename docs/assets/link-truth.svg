  0%,58.833% { opacity:0; clip-path:inset(0 100% 0 0); }
  58.889% { opacity:1; clip-path:inset(0 100% 0 0); }
  64.578% { opacity:1; clip-path:inset(0 0 0 0); }
  96.111% { opacity:1; clip-path:inset(0 0 0 0); }
  98.333%,100% { opacity:0; clip-path:inset(0 0 0 0); }
}
@keyframes t_9 {
  0%,66.056% { opacity:0; }
  68.056% { opacity:1; }
  96.111% { opacity:1; }
  98.333%,100% { opacity:0; }
}
@keyframes t_10 {
  0%,69.389% { opacity:0; }
  71.389% { opacity:1; }
  96.111% { opacity:1; }
  98.333%,100% { opacity:0; }
}
@keyframes t_11 {
  0%,74.389% { opacity:0; clip-path:inset(0 100% 0 0); }
  74.444% { opacity:1; clip-path:inset(0 100% 0 0); }
  82.778% { opacity:1; clip-path:inset(0 0 0 0); }
  96.111% { opacity:1; clip-path:inset(0 0 0 0); }
