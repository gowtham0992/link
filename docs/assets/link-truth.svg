<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"
     aria-label="Link demo: a new memory conflicts with an old one; Link replaces it with lineage, recall returns only the current truth, and --as-of answers what was true back then.">
  <style>
    .win { fill:#221c12; stroke:#3b342a; }
    text { font-family:'SF Mono','Menlo','Consolas',ui-monospace,monospace; font-size:15px; opacity:0; }
    .cmd { font-weight:500; }
@keyframes t_0 {
  0%,2.722% { opacity:0; clip-path:inset(0 100% 0 0); }
  2.778% { opacity:1; clip-path:inset(0 100% 0 0); }
  11.111% { opacity:1; clip-path:inset(0 0 0 0); }
  53.889% { opacity:1; clip-path:inset(0 0 0 0); }
  56.111%,100% { opacity:0; clip-path:inset(0 0 0 0); }
}
@keyframes t_1 {
  0%,11.056% { opacity:0; }
  13.056% { opacity:1; }
  53.889% { opacity:1; }
  56.111%,100% { opacity:0; }
}
