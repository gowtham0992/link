  0%,32.167% { opacity:0; }
  34.167% { opacity:1; }
  53.889% { opacity:1; }
  56.111%,100% { opacity:0; }
}
@keyframes t_6 {
  0%,37.722% { opacity:0; clip-path:inset(0 100% 0 0); }
  37.778% { opacity:1; clip-path:inset(0 100% 0 0); }
  46.111% { opacity:1; clip-path:inset(0 0 0 0); }
  53.889% { opacity:1; clip-path:inset(0 0 0 0); }
  56.111%,100% { opacity:0; clip-path:inset(0 0 0 0); }
}
@keyframes t_7 {
  0%,47.722% { opacity:0; }
  49.722% { opacity:1; }
  53.889% { opacity:1; }
  56.111%,100% { opacity:0; }
}
