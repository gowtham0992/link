  0%,19.389% { opacity:0; clip-path:inset(0 100% 0 0); }
  19.444% { opacity:1; clip-path:inset(0 100% 0 0); }
  26.911% { opacity:1; clip-path:inset(0 0 0 0); }
  53.889% { opacity:1; clip-path:inset(0 0 0 0); }
  56.111%,100% { opacity:0; clip-path:inset(0 0 0 0); }
}
@keyframes t_4 {
  0%,28.278% { opacity:0; }
  30.278% { opacity:1; }
  53.889% { opacity:1; }
  56.111%,100% { opacity:0; }
}
