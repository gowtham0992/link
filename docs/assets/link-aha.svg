<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"
     aria-label="Link demo: recall finds a memory phrased in different words, and a new agent session is greeted with memory automatically.">
  <style>
    .win { fill:#221c12; stroke:#3b342a; }
    text { font-family:'SF Mono','Menlo','Consolas',ui-monospace,monospace; font-size:15px; }
    .cmd { font-weight:500; }
  </style>
  <defs>
    <clipPath id="tw0"><rect x="28" y="61" height="24" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="linear" values="0;0;437;437" keyTimes="0.00000;0.03571;0.14086;1.00000"/></rect></clipPath>
<clipPath id="tw2"><rect x="28" y="133" height="24" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="linear" values="0;0;455;455" keyTimes="0.00000;0.17857;0.28571;1.00000"/></rect></clipPath>
  </defs>
  <rect class="win" x="1" y="1" width="718" height="298" rx="12"/>
  <rect x="1" y="1" width="718" height="34" rx="12" fill="#1a150d"/>
  <circle cx="24" cy="18" r="5" fill="#e06c60"/>
  <circle cx="44" cy="18" r="5" fill="#e0b34f"/>
  <circle cx="64" cy="18" r="5" fill="#7fae8f"/>
  <text x="360" y="23" text-anchor="middle" fill="#8a8174" style="font-size:12px;letter-spacing:.08em;">lnk · local agent memory</text>
  <rect x="30" y="270" width="9" height="16" fill="#e0955f"><animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.5"/></rect>
  <text x="30" y="78" class="cmd" fill="#f3ece0" opacity="0" clip-path="url(#tw0)">$ lnk remember "feat/short-topic branch names"<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.03571;0.03714;0.43571;0.46286;1.00000"/></text>
  <text x="30" y="106" class="out" fill="#86c79a" opacity="0">✓ saved to local memory<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.13714;0.16214;0.43571;0.46286;1.00000"/></text>
  <text x="30" y="150" class="cmd" fill="#f3ece0" opacity="0" clip-path="url(#tw2)">$ lnk recall "how should I name my git branches"<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.17857;0.18000;0.43571;0.46286;1.00000"/></text>
  <text x="30" y="178" class="out" fill="#86c79a" opacity="0">✓ feat/short-topic branch names<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.29429;0.31929;0.43571;0.46286;1.00000"/></text>
  <text x="52" y="204" class="note" fill="#e0955f" opacity="0">→ matched by meaning, not keywords<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.33714;0.36214;0.43571;0.46286;1.00000"/></text>
  <text x="30" y="96" class="dim" fill="#8a8174" opacity="1">— you open a new agent session —<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="1;0;0;1;1" keyTimes="0.00000;0.00857;0.52286;0.54786;1.00000"/></text>
  <text x="30" y="140" class="out" fill="#e0955f" opacity="1">Link memory · injected automatically<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="1;0;0;1;1" keyTimes="0.00000;0.00857;0.58714;0.61214;1.00000"/></text>
  <text x="30" y="168" class="out" fill="#f3ece0" opacity="1">• prefers feat/short-topic branch names<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="1;0;0;1;1" keyTimes="0.00000;0.00857;0.64429;0.66929;1.00000"/></text>
  <text x="30" y="196" class="out" fill="#f3ece0" opacity="1">• keep PR descriptions short<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="1;0;0;1;1" keyTimes="0.00000;0.00857;0.69429;0.71929;1.00000"/></text>
  <text x="52" y="240" class="note" fill="#e0955f" opacity="1">no one asked. it just remembered.<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" values="1;0;0;1;1" keyTimes="0.00000;0.00857;0.78000;0.80500;1.00000"/></text>
</svg>
